<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — KitchenIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <!-- Theme (must be before paint to avoid flash) -->
    <script src="../js/theme.js"></script>
</head>
<body>

<div class="kiq-app">

    <aside class="kiq-sidebar">
        <a href="dashboard.html" class="kiq-sidebar-logo">
            <div class="kiq-sidebar-logo-icon"><i class="fa-solid fa-utensils"></i></div>
            <div class="kiq-sidebar-logo-text">KitchenIQ <span>Pro</span></div>
        </a>

        <a href="live.html" class="kiq-nav-link"><i class="fa-solid fa-bolt"></i><span>Live Orders</span></a>
        <nav class="kiq-sidebar-nav">
            <div class="kiq-nav-section">Main</div>
            <a href="dashboard.html" class="kiq-nav-link"><i class="fa-solid fa-chart-pie"></i><span>Dashboard</span></a>
            <a href="analytics.html" class="kiq-nav-link"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a>
            <a href="dishes.html" class="kiq-nav-link"><i class="fa-solid fa-burger"></i><span>Dishes</span></a>
            <a href="customers.html" class="kiq-nav-link"><i class="fa-solid fa-users"></i><span>Customers</span></a>
            <a href="finance.html" class="kiq-nav-link"><i class="fa-solid fa-indian-rupee-sign"></i><span>Finance</span></a>
            <a href="foodcost.html" class="kiq-nav-link"><i class="fa-solid fa-calculator"></i><span>Food Cost</span></a>
            <a href="insights.html" class="kiq-nav-link"><i class="fa-solid fa-lightbulb"></i><span>AI Insights</span><span class="kiq-nav-badge">AI</span></a>
            <a href="notifications.html" class="kiq-nav-link active"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
            <a href="reports.html" class="kiq-nav-link"><i class="fa-solid fa-file-lines"></i><span>Reports</span></a>
            <div class="kiq-nav-section">System</div>
            <a href="team.html" class="kiq-nav-link"><i class="fa-solid fa-user-group"></i><span>Team</span></a>
            <a href="activity.html" class="kiq-nav-link"><i class="fa-solid fa-clock-rotate-left"></i><span>Activity</span></a>

            <a href="plans.html" class="kiq-nav-link"><i class="fa-solid fa-crown"></i><span>Plans & Billing</span></a>


            <a href="settings.html" class="kiq-nav-link"><i class="fa-solid fa-gear"></i><span>Settings</span></a>

            <div class="kiq-nav-section">Data</div>
            <a href="integrations.html" class="kiq-nav-link"><i class="fa-solid fa-plug"></i><span>Integrations</span></a>
            <a href="upload.html" class="kiq-nav-link"><i class="fa-solid fa-cloud-arrow-up"></i><span>Upload CSV</span></a>
        </nav>
        <div class="kiq-sidebar-footer">
            <a href="#" id="logoutBtn" class="kiq-nav-link"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></a>
        </div>
    </aside>

    <header class="kiq-topbar">
        <div class="kiq-topbar-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search...">
        </div>
        <div class="kiq-topbar-actions">
            <div id="kiq-bell-container"></div>
            <div class="kiq-topbar-user">
                <div class="kiq-topbar-user-info">
                    <div class="kiq-topbar-user-name" id="userName">—</div>
                    <div class="kiq-topbar-user-role">Owner</div>
                </div>
                <div class="kiq-avatar" id="userAvatar">?</div>
            </div>
        </div>
    </header>

    <main class="kiq-content">

        <div class="kiq-page-header">
            <div>
                <h1 class="kiq-page-title">Notifications</h1>
                <p class="kiq-page-subtitle">All your alerts and updates</p>
            </div>
            <div class="kiq-page-actions">
                <button class="kiq-btn kiq-btn-secondary" id="markAllBtn">
                    <i class="fa-solid fa-check-double"></i> Mark all read
                </button>
                <button class="kiq-btn kiq-btn-secondary" id="testBtn">
                    <i class="fa-solid fa-flask"></i> Test
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--kiq-border); margin-bottom: 24px;">
            <button class="kiq-tab active" data-filter="all">All</button>
            <button class="kiq-tab" data-filter="unread">Unread</button>
            <button class="kiq-tab" data-filter="success">Success</button>
            <button class="kiq-tab" data-filter="warning">Warnings</button>
            <button class="kiq-tab" data-filter="danger">Critical</button>
        </div>

        <div id="notifList">
            <p style="text-align:center; padding: 40px; color: var(--kiq-text-muted);">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Loading...
            </p>
        </div>

        <div style="height: 60px;"></div>
    </main>
</div>

<style>
    .kiq-tab {
        background: none; border: none; padding: 12px 20px;
        font-size: 14px; font-weight: 500; color: var(--kiq-text-muted);
        border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s;
        margin-bottom: -1px;
    }
    .kiq-tab:hover { color: var(--kiq-text); }
    .kiq-tab.active { color: var(--kiq-brand-600); border-bottom-color: var(--kiq-brand-600); }
</style>

<script src="../js/config.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/notifications-bell.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/kitchen-switcher.js"></script>
</body>
</html>
