<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — KitchenIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
    <!-- Theme (must be before paint to avoid flash) -->
    <script src="../js/theme.js"></script>
</head>
<body>
<div class="kiq-auth">
    <div class="kiq-auth-brand">
        <a href="#" class="kiq-auth-logo">
            <div class="kiq-auth-logo-icon"><i class="fa-solid fa-utensils"></i></div>
            <div class="kiq-auth-logo-text">KitchenIQ <span>Pro</span></div>
        </a>
        <div class="kiq-auth-hero">
            <h1>Smarter Decisions.<br><span>Higher Profits.</span></h1>
            <p>Track orders, analyze performance, understand customers, and get AI-powered insights.</p>
            <div class="kiq-auth-features">
                <div class="kiq-auth-feature">
                    <div class="kiq-auth-feature-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <div>
                        <div class="kiq-auth-feature-title">Real-time Analytics</div>
                        <div class="kiq-auth-feature-sub">Track revenue & profit</div>
                    </div>
                </div>
                <div class="kiq-auth-feature">
                    <div class="kiq-auth-feature-icon"><i class="fa-solid fa-users"></i></div>
                    <div>
                        <div class="kiq-auth-feature-title">Customer Insights</div>
                        <div class="kiq-auth-feature-sub">Understand your audience</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="kiq-auth-form-wrap">
        <div class="kiq-auth-form">
            <div class="kiq-auth-tabs">
                <a href="#" class="kiq-auth-tab active">Login</a>
                <a href="signup.html" class="kiq-auth-tab">Register</a>
            </div>

            <div class="kiq-auth-header">
                <h2>Welcome back!</h2>
                <p>Sign in to continue to your dashboard.</p>
            </div>

            <div class="kiq-auth-error kiq-alert kiq-alert-danger" id="authError">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span class="err-text"></span>
            </div>

            <form id="loginForm" novalidate>
                <div class="kiq-input-group">
                    <label class="kiq-label">Email Address</label>
                    <input type="email" class="kiq-input" name="email" placeholder="you@example.com" required>
                </div>
                <div class="kiq-input-group">
                    <label class="kiq-label">Password</label>
                    <input type="password" class="kiq-input" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="kiq-btn kiq-btn-primary kiq-btn-lg kiq-btn-block">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>
            </form>
        </div>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
