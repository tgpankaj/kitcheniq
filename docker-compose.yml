# ============================================================
# KitchenIQ — Docker Compose
# Run: docker compose up -d
# ============================================================

services:

  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:15-alpine
    container_name: kitcheniq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitcheniq
      POSTGRES_PASSWORD: kitcheniq_docker_pw
      POSTGRES_DB: kitcheniq
      TZ: Asia/Kolkata
    ports:
      - "5433:5432"   # 5433 to avoid conflict with local Postgres
    volumes:
      - kitcheniq_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitcheniq -d kitcheniq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kitcheniq-net

  # ---------- Backend (Flask) ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitcheniq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kitcheniq:kitcheniq_docker_pw@postgres:5432/kitcheniq
      SECRET_KEY: docker-dev-secret-key-change-in-prod
      FLASK_ENV: production
      PORT: "5000"
      TOKEN_ENCRYPTION_KEY: 4Z3hVt9pQjK1wY7nBmRxCcFdEfHgJiLkMnOpQrStUvA=
      CORS_ORIGINS: "http://localhost:5500,http://localhost:3000"
      RAZORPAY_KEY_ID: rzp_test_mock_key_id
      RAZORPAY_KEY_SECRET: rzp_test_mock_secret
      RAZORPAY_WEBHOOK_SECRET: whsec_test_mock
      RAZORPAY_MOCK_MODE: "true"
      SENDGRID_API_KEY: SG.mock_key
      SENDGRID_FROM_EMAIL: noreply@kitcheniq.in
      SENDGRID_FROM_NAME: KitchenIQ
      EMAIL_MOCK_MODE: "true"
    ports:
      - "5050:5000"
    volumes:
      - kitcheniq_uploads:/app/uploads
    networks:
      - kitcheniq-net

  # ---------- Frontend (static server) ----------
  frontend:
    image: nginx:alpine
    container_name: kitcheniq-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - kitcheniq-net

volumes:
  kitcheniq_pgdata:
    driver: local
  kitcheniq_uploads:
    driver: local

networks:
  kitcheniq-net:
    driver: bridge
