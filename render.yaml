services:
  - type: web
    name: kitcheniq-api
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "bash entrypoint.sh"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_THREADS
        value: 4
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        fromDatabase:
          name: kitcheniq-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://kitcheniq.pages.dev,http://localhost:5500,http://127.0.0.1:5500

databases:
  - name: kitcheniq-db
    region: singapore
    plan: free
    databaseName: kitcheniq
    user: kitcheniq